name: 飞猪旅行去广告
description: 移除开屏广告
author: 奶思
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/TaobaoTravel.png
rewrites:
- match: (?i)^https://acs\.m\.taobao\.com/gw/mtop\.fliggy\.crm\.screen\.allresource/
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://acs\.m\.taobao\.com/gw/mtop\.fliggy\.crm\.screen\.predict/
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://acs\.m\.taobao\.com/gw/mtop\.fliggy\.tripzoo\.new\.couponlist/
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://acs\.m\.taobao\.com/gw/mtop\.trip\.my\.recommendcard/
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://acs\.m\.taobao\.com/gw/mtop\.fliggy\.recommend\.common\.guess\.tab\.feeds/
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
mitm:
  hostnames:
    includes:
    - acs.m.taobao.com
name: 微信功能增强
description: 微信110解锁被屏蔽的URL、去广告解锁内容隐藏
author: @zZPiglet @ddgksf2013
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/WeChat.png
rewrites:
- match: ^https?:\/\/api\.blibee\.com\/cvsnotify-api\/cvs\/notify\/app\/banner\/v\d+$
  actions:
  - respond:
      status: 200
- match: ^https?:\/\/ucmp\.sf-express\.com\/proxy\/operation-platform\/info-flow-adver\/query$
  actions:
  - respond:
      status: 200
scriptings:
- http_response:
    name: weixin110
    match: ^https\:\/\/(weixin110\.qq|security.wechat)\.com\/cgi-bin\/mmspamsupport-bin\/newredirectconfirmcgi\?
    script_url: https://raw.githubusercontent.com/ddgksf2013/Scripts/refs/heads/master/weixin110.js
    max_size: -1
    timeout: 60
    body_required: true
- http_response:
    name: replaceBody
    match: ^(http|https):\/\/mp\.weixin\.qq\.com\/mp\/getappmsgad
    script_url: https://raw.githubusercontent.com/Script-Hub-Org/Script-Hub/main/scripts/replace-body.js
    env:
      _compat.$argument: advertisement-%3Eddgksf2013
    timeout: 30
    body_required: true
- http_response:
    name: zhangshanggongjiao
    match: ^https?:\/\/wx\.mygolbs\.com\/WxBusServer\/ApiData\.do
    script_url: https://raw.githubusercontent.com/ddgksf2013/Scripts/refs/heads/master/zhangshanggongjiao.js
    timeout: 60
    body_required: true
- http_response:
    name: applet
    match: ^(https?://)?([a-zA-Z0-9]+(-[a-zA-Z0-9]+)*\.)+[a-zA-Z]{2,}(:\d+)?/wp-json/[a-zA-Z0-9_-]+/(mp\/)?v\d/posts
    script_url: https://raw.githubusercontent.com/ddgksf2013/Scripts/refs/heads/master/applet.js
    timeout: 60
    body_required: true

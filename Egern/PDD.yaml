name: 拼多多去广告
description: 拼多多净化页面布局
author: 怎么肥事 walala
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/PinDuoDuo.png

rules:
- and:
    match:
    - url_regex:
        match: ^http://((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)/d(\d)?
    - user_agent:
        match: '*com.xunmeng.pinduoduo*'
    policy: REJECT
- and:
    match:
    - url_regex:
        match: ^http://\[[0-9a-fA-F:]+\]/d(\d)?\?
    - user_agent:
        match: '*com.xunmeng.pinduoduo*'
    policy: REJECT
- and:
    match:
    - domain:
        match: api.pinduoduo.com
    - protocol:
        match: QUIC
    policy: REJECT
- domain:
    match: sdk.1rtb.net
    policy: REJECT
- domain:
    match: titan.pinduoduo.com
    policy: REJECT
- ip_cidr:
    match: 121.5.84.85/32
    policy: REJECT
- ip_cidr:
    match: 183.194.214.21/32
    policy: REJECT
- ip_cidr:
    match: 49.235.102.190/32
    policy: REJECT
- ip_cidr:
    match: 81.69.116.33/32
    policy: REJECT
- ip_cidr:
    match: 183.194.214.20/32
    policy: REJECT
- ip_cidr:
    match: 117.185.244.145/32
    policy: REJECT
- ip_cidr:
    match: 183.194.214.14/32
    policy: REJECT

      jq: delpaths([["title_bar_items"]])
- match: ^https:\/\/api\.pinduoduo\.com\/api\/philo\/personal\/hub\?
  actions:
  - response_body:
      jq: delpaths([["personal_banner"]])
- match: ^https:\/\/api\.pinduoduo\.com\/api\/oak\/integration\/render\?
  actions:
  - response_body:
      jq: delpaths([["bottom_section_list"]])
- match: ^https:\/\/api\.pinduoduo\.com\/api\/oak\/integration\/render\?
  actions:
  - response_body:
      jq: delpaths([["ui","bottom_section"]])
- match: ^https:\/\/api\.pinduoduo\.com\/api\/oak\/integration\/render\?
  actions:
  - response_body:
      jq: delpaths([["ui","live_section","float_info"]])
- match: ^https:\/\/api\.pinduoduo\.com\/api\/caterham\/v3\/query\/order_detail_group\?
  actions:
  - response_body:
      jq: delpaths([["goods_list"]])
- match: ^https:\/\/api\.pinduoduo\.com\/order\/\d+-\d+\/shipping
  actions:
  - response_body:
      jq: delpaths([["shipping","banner_above_recommend"]])
- match: ^https:\/\/api\.pinduoduo\.com\/api\/aristotle\/order_list_v4\?
  actions:
  - response_body:
      jq: .orders |= map(.order_buttons |= map(del(.order_growth_tip)))
mitm:
  hostnames:
    includes:
    - api.pinduoduo.com
    - api.yangkeduo.com

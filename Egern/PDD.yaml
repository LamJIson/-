      body: '{}'
- match: ^https:\/\/api\.pinduoduo\.com\/api\/alexa\/homepage\/hub
  actions:
  - response_body:
      jq: del(.result.icon_set, .result.search_bar_hot_query, .result.dy_module.irregular_banner_dy,.result.dy_module.recommend_fresh_info) | if .result.bottom_tabs then .result.bottom_tabs |= map(select(.link == "index.html" or .link == "chat_list.html" or .link == "personal.html")) else . end
- match: ^https:\/\/api\.pinduoduo\.com\/search
  actions:
  - response_body:
      jq: del(.expansion)
- match: ^https:\/\/api\.pinduoduo\.com\/api\/philo\/personal\/hub
  actions:
  - response_body:
      jq: del(.monthly_card_entrance, .personal_center_style_v2_vo, .icon_set.icons, .icon_set.top_personal_icons)
- match: ^https:\/\/api\.pinduoduo\.com\/api\/oak\/integration\/render
  actions:
  - response_body:
      jq: del(.bottom_section_list, .ui.bottom_section, .ui.live_section.float_info)
- match: ^https:\/\/api\.pinduoduo\.com\/api\/caterham\/v3\/query\/order_detail_group
  actions:
  - response_body:
      jq: del(.data.goods_list)
mitm:
  hostnames:

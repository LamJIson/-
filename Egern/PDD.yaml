      jq: delpaths([["result","dy_module","irregular_banner_dy"]])
- match: ^https:\/\/api\.pinduoduo\.com\/search\?
  actions:
  - response_body:
      jq: delpaths([["expansion"]])
- match: ^https:\/\/api\.pinduoduo\.com\/api\/alexa\/homepage\/hub\?
  actions:
  - response_body:
      jq: .result.bottom_tabs? |= map(select(.link | IN("index.html","chat_list.html","personal.html"))) | .result.buffer_bottom_tabs? |= map(select(.link | IN("index.html","chat_list.html","personal.html"))) | .result.all_top_opts = [] | .result.module_order? |= map(select(.module_name | IN("irregular_banner","ad_module","timeline") | not))
